services:
  - type: web
    name: rosco
    runtime: node
    plan: free
    region: virginia
    # Vite y TypeScript son herramientas de compilacion (devDependencies).
    # Render expone NODE_ENV=production durante el build, asi que las incluimos
    # explicitamente y las quitamos una vez generados los artefactos.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ROOM_SIGNING_SECRET
        generateValue: true
